[project]
name = "cecilia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GS-Silva", email = "gabriel.ferreira.profile@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.10.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.15.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.9.1",
    "sqlmodel>=0.0.48",
    "types-aiobotocore[essential]>=3.10.0",
    "uv>=0.13.1",
]

[project.scripts]
cecilia = "cecilia:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "cecilia",
]
