[project]
name = "cecilia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GS-Silva", email = "gabriel.ferreira.profile@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-cognitiveservices-speech>=1.52.0",
    "fastapi[standard]>=0.143.0",
    "groq>=1.7.0",
    "openrouter>=1.3.43",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.1",
    "sqlmodel>=0.0.48",
    "uv>=0.13.1",
]

[project.scripts]
cecilia = "cecilia:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "cecilia",
]
