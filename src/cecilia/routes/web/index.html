<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cecilia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class='homepage'>
        <header>
            <h1 class="title">Cecilia</h1>
        </header>

        <nav id="chat_nav" aria-label="Chats navigation">
            <button id='create_new_chat'>+ Create new chat</button>
            <ul id="chat_nav__options"></ul>
        </nav>

        <main>
            <textarea id="prompt" type="text" placeholder="What do you want do do?"></textarea>
            <br><br>
            <div id="messages"></div>
            
        </main>

        <footer>
            <p class="credits">Developer: Gabriel - @GF-Silva</p>
            <p class="credits">Github: <a href="https://github.com/GF-Silva/Cecilia">https://github.com/GF-Silva/Cecilia</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/static/script.js"></script>

    {% if DEBUG %}
        {{ hot_reload.script(url_for('hot-reload')) | safe }}
    {% endif %}
</body>
</html>
