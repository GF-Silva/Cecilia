<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cecilia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class='homepage'>
        <header>
            <h1 class="title">Cecilia</h1>
            <div>
                <label for="effort">Effort: </label>
                <select name="effort" id="effort">
                    <option value=''>Default</option>
                    <option value="none">none</option>
                    <option value="minimal">minimal</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="xhigh">xhigh</option>
                    <option value="max">max</option>
                </select>
            </div>

            <div>
                <label for="model">Model: </label>
                <select name='model' id='model'>
                    <option value="google/gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
                    <option value="deepseek/deepseek-v4.1-flash">DeepSeek V4.1 Flash</option>
                    <option value="~anthropic/claude-opus-latest">Claude Opus lastest</option>
                    <option value="anthropic/claude-opus-5.5">Claude Opus 5.5</option>
                    <option value="anthropic/claude-sonnet-5.5">Claude Sonnet 5.5</option>
                    <option value='anthropic/claude-haiku-5.5'>Claude Haiku 5.5</option>
                    <option value="anthropic/claude-fable-5.2">Claude Fable 5.2</option>
                    <option value="openai/gpt-4">GPT 4</option>
                    <option value="openai/gpt-6.1-sol">GPT 6.1 Sol</option>
                    <option value="openai/gpt-6-astra">GPT 6 Astra</option>
                    <option value="openai/gpt-6.1-terra">GPT 6.1 Terra</option>
                    <option value="openai/gpt-6-luna">GPT 6 Luna</option>
                </select>
            </div>
        </header>

        <nav id="chat_nav" aria-label="Chats navigation">
            <button id='create_new_chat'>+ Create new chat</button>
            <ul id="chat_nav__options"></ul>
        </nav>

        <main>
            <div class="prompt__container">
                <button popovertarget="prompt__options" class="prompt__options__opener" aria-haspopup="menu">+</button>
                <div popover id="prompt__options">
                    <label for="prompt__options__upload-attachment" class="prompt__options__upload-attachment__label">Upload file</label>
                    <input accept="image/*; audio/*" type="file" name="Upload attachment" id="prompt__options__upload-attachment" hidden>
                </div>
                <textarea id="prompt" type="text" placeholder="What do you want do do?"></textarea>
            </div>
            <br><br>
            <div id="messages"></div>
        </main>

        <footer>
            <p class="credits">Developer: Gabriel - @GF-Silva</p>
            <p class="credits">Github: <a href="https://github.com/GF-Silva/Cecilia">https://github.com/GF-Silva/Cecilia</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/static/script.js"></script>

    {% if DEBUG %}
        {{ hot_reload.script(url_for('hot-reload')) | safe }}
    {% endif %}
</body>
</html>
